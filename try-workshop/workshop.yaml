apiVersion: training.educates.dev/v1beta1
kind: Workshop
metadata:
  name: "@WORKSHOP_NAME@"
spec:
  title: "Try @PACKAGE_NAMES@"
  description: "Generated by package.sh try to try the extension packages @PACKAGE_NAMES@."
  publish:
    image: "$(image_repository)/@WORKSHOP_NAME@-files:$(workshop_version)"
  workshop:
    image: "@WORKSHOP_IMAGE@"
    files:
    - image:
        url: "$(image_repository)/@WORKSHOP_NAME@-files:$(workshop_version)"
      includePaths:
      - /workshop/**
    packages:
@PACKAGES@
  session:
    resources:
      memory: 3Gi
    namespaces:
      security:
        token:
          enabled: false
    applications:
      terminal:
        enabled: true
        layout: split
      editor:
        enabled: true
      console:
        enabled: false
      docker:
        enabled: false
      registry:
        enabled: false
      slides:
        enabled: false
      vcluster:
        enabled: false
