name: Check

# Checks a pull request: the bats suite, then a publish dry run of each
# package in a job of its own.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    services:
      # Served on the local registry's port, localhost:5001, which the
      # tests use by default and try always publishes to.
      registry:
        image: registry:2
        ports:
          - 5001:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/install-educates

      - name: Install bats
        uses: bats-core/bats-action@3566550e0f594451ac0f58fcbfdeca93aa29a45e # 4.1.0
        with:
          bats-version: 1.14.0
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false

      - name: Run the bats suite
        run: bats test

  packages:
    name: Packages
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: List the packages
        id: list
        run: echo "packages=$(./package.sh list | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"

  dry-run:
    name: Dry run ${{ matrix.package }}
    needs: [test, packages]
    if: needs.packages.outputs.packages != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.packages.outputs.packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/install-educates

      - name: Fetch and validate the package
        env:
          PACKAGE: ${{ matrix.package }}
        run: ./package.sh publish --dry-run --image-repository ghcr.io/educates/extension-packages "$PACKAGE"
